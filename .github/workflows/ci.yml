# Continuous integration.
#
# The job calls `make check`, not its own list of steps, so what runs here is
# exactly what a contributor can run before pushing. A check that lives only in
# a workflow file cannot be tried locally; one that lives only in a Makefile
# does not stop anybody. The same target, both places.
#
# THIS REPLACES lint-sql.yml. That workflow ran the SQL guard and nothing else,
# so for as long as it existed this module's 20 test files never ran on a push
# — and this is the module that supplies authentication, sessions, password
# hashing and the API-key store to every host built on loon. The SQL guard is
# now one line of `make check` rather than a second workflow running it twice.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Weekly, because the interesting failures on a small project are not the
  # ones a commit causes — they are a dependency moving, a base image changing,
  # or the Go toolchain deprecating something.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    # A Postgres and a Redis, because without them the integration tests SKIP —
    # which is right on a laptop and wrong here. A skipped test and a passing
    # test are the same green tick, and these are the ones that exercise real
    # SCAN+DEL batching and real schema round-trips.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: demo
          POSTGRES_PASSWORD: demo
          POSTGRES_DB: loon_baseline_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10

    env:
      LOON_TEST_DSN: postgres://demo:demo@localhost:5432/loon_baseline_test?sslmode=disable
      # REDIS_TEST_ADDR, not REDIS_ADDR. The DeletePrefix test calls FlushDB, so
      # it must never be pointed at anything but a throwaway; REDIS_ADDR is the
      # operator's own switch and is set in every compose file in this project.
      # That test was gated on REDIS_ADDR until 21 Aug 2026.
      REDIS_TEST_ADDR: localhost:6379

    steps:
      - uses: actions/checkout@v4
        with:
          path: loon-baseline

      # loon is a sibling module (go.mod replace => ../loon), so it has to be on
      # disk beside this one before anything resolves.
      - uses: actions/checkout@v4
        with:
          repository: ameNZB/loon
          path: loon

      - uses: actions/setup-go@v5
        with:
          go-version-file: loon-baseline/go.mod
          cache-dependency-path: loon-baseline/go.sum

      - name: No go.work, and it builds
        working-directory: loon-baseline
        run: |
          test ! -f go.work || { echo "go.work is committed; it must not be"; exit 1; }
          go build ./...
        env:
          GOWORK: "off"

      # GO=go: CI is already a clean Linux container, so running the toolchain
      # inside another one buys nothing. The Docker path exists for developer
      # machines where an anti-virus quarantines freshly built binaries.
      - name: Checks
        working-directory: loon-baseline
        run: make check GO=go
        env:
          GOWORK: "off"

      # The tests that would otherwise skip. Named separately from `check` so
      # the log says plainly whether they ran — a skip and a pass look identical
      # in a summary line.
      - name: Integration tests actually ran
        working-directory: loon-baseline
        run: |
          out=$(go test -count=1 ./cache/redis/ ./heartbeat/ ./jobtrigger/ ./session/ -v 2>&1)
          echo "$out" | grep -E '^(=== RUN|--- (PASS|SKIP|FAIL))' || true
          if echo "$out" | grep -q -- '--- SKIP'; then
            echo "an integration test skipped despite the services being up"
            exit 1
          fi
        env:
          GOWORK: "off"

      - name: Known vulnerabilities in code we call
        working-directory: loon-baseline
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        env:
          GOWORK: "off"
